	<h1>5</h1>
	<h1>5</h1>
    <h1>Job Listings</h1>
    <div id="job-list"></div>
    <div id="pagination"></div> <!-- Pagination container -->
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const csvFilePath = 'WeWorkRemotely_Jobs.csv'; // Path to your CSV file
        const jobsPerPage = 10; // Number of jobs to display per page
        let currentPage = 1; // Current page number

        Papa.parse(csvFilePath, {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                const jobs = results.data;
                renderJobs(jobs, currentPage);
                renderPagination(jobs.length);
            }
        });

        function renderJobs(jobs, page) {
            const jobList = document.getElementById('job-list');
            jobList.innerHTML = ''; // Clear existing content

            // Calculate start and end index for jobs on current page
            const startIndex = (page - 1) * jobsPerPage;
            const endIndex = startIndex + jobsPerPage;

            // Slice the array to get jobs for the current page
            const jobsToShow = jobs.slice(startIndex, endIndex);

            // Display jobs
            jobsToShow.forEach(job => {
                const jobDiv = document.createElement('div');
                jobDiv.classList.add('job');

                jobDiv.innerHTML = `
                    <h3>${job['Job Title']}</h3>
                    <p>Company: ${job['Company']}</p>
                    <p>Location: ${job['Location']}</p>
                    <a href="${job['Job Link']}">Job Link</a>
                `;
                jobList.appendChild(jobDiv);
            });
        }

        function renderPagination(totalJobs) {
            const totalPages = Math.ceil(totalJobs / jobsPerPage);
            const paginationDiv = document.getElementById('pagination');
            paginationDiv.innerHTML = ''; // Clear existing content

            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.textContent = i;
                pageButton.addEventListener('click', function() {
                    currentPage = i;
                    renderJobs(results.data, currentPage);
                });
                paginationDiv.appendChild(pageButton);
            }
        }
    });
</script>
